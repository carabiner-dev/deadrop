name: token-exchange

on:
  workflow_dispatch: {}
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions: {}

jobs:
  headless-login:
    name: Headless login with the actions token
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to mint the OIDC token deadrop exchanges at the server
      id-token: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Log in exchanging the ambient actions token
        run: go run ./cmd/deadrop login --server https://auth.carabiner.dev
