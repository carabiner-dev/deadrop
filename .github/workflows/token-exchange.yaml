name: token-exchange

on:
  workflow_dispatch:
    inputs:
      server:
        description: Deadrop server to exchange the token against
        type: choice
        default: https://auth.carabiner.dev
        options:
          - https://auth.carabiner.dev
          - https://auth.dev.carabiner.dev
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions: {}

jobs:
  headless-login:
    name: Headless login with the actions token
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to mint the OIDC token deadrop exchanges at the server
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Log in exchanging the ambient actions token
        # PR and push runs always test against prod; manual runs can choose
        env:
          DEADROP_SERVER: ${{ inputs.server || 'https://auth.carabiner.dev' }}
        run: go run ./cmd/deadrop login --auth-server "$DEADROP_SERVER"
