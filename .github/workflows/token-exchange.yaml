name: token-exchange

on:
  # Temporarily manual-only until the auth server has a tenant for this repository.
  # Restore PR and push triggers once tenant ownership is configured.
  workflow_dispatch:
    inputs:
      server:
        description: Deadrop server to exchange the token against
        type: choice
        default: https://auth.carabiner.dev
        options:
          - https://auth.carabiner.dev
          - https://auth.dev.carabiner.dev

permissions: {}

jobs:
  headless-login:
    name: Headless login with the actions token
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to mint the OIDC token deadrop exchanges at the server
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Log in exchanging the ambient actions token
        env:
          DEADROP_SERVER: ${{ inputs.server }}
        run: go run ./cmd/deadrop login --auth-server "$DEADROP_SERVER"
